name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  TZ: Asia/Seoul
  npm_config_audit: "false"
  npm_config_engine_strict: "true"
  npm_config_fund: "false"
  npm_config_prefer_offline: "true"

jobs:
  verify:
    name: Verify public source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source without push credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TEMPORARY: can a GitHub runner reach 지하실? Removed before merge.
      - name: Probe 지하실 from the runner
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            curl -sS -m 20 -o /dev/null -w "catalog %{http_code} %{size_download}B %{time_total}s\n" "https://jihasil.com/catalog/initial_categories?ai_recommendations=false&continue_watching=false&my_library=false&preview=false&user=false" || true
            curl -sS -m 20 -o /dev/null -w "home %{http_code} %{size_download}B\n" "https://jihasil.com/" || true
            node scripts/jihasil.mjs || true
            sleep 5
          done
          git diff --stat -- data/jihasil.json
          git checkout -- data/jihasil.json

      - name: Run project checks
        run: npm run check

      - name: Audit production dependencies
        run: npm run audit:deps

      - name: Audit the public repository
        run: npm run audit:public
