name: Check public site health
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - name: Probe source connectivity without changing data
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const sources=JSON.parse(fs.readFileSync('data/source-health.json')).health.filter(x=>!x.skipped&&x.url);
          for(let i=0;i<sources.length;i+=5)await Promise.all(sources.slice(i,i+5).map(async x=>{const start=Date.now();try{const r=await fetch(x.url,{signal:AbortSignal.timeout(15000),headers:{'user-agent':'Mozilla/5.0','accept':'*/*'}});await r.arrayBuffer();console.log(JSON.stringify({source:x.sourceId,status:r.status,ms:Date.now()-start}))}catch(e){console.log(JSON.stringify({source:x.sourceId,error:e.message,cause:e.cause?.code,ms:Date.now()-start}))}}));
          JS
