name: Check public site health

on:
  workflow_dispatch:
  schedule:
    - cron: "43 0 * * *"

permissions: {}

concurrency: { group: public-site-health, queue: max }

env:
  TZ: Asia/Seoul
  SITE_HEALTH_URL: https://seoulcinemaschedule.com

jobs:
  health:
    name: Verify the deployed site
    if: github.event_name != 'schedule' || vars.HOSTED_COLLECTION_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out health scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2

      - name: Read the live deployment ID
        env:
          HEALTH_CACHE_BUSTER: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from "node:fs/promises";
          import { fetchWithTransientRetry } from "./scripts/http-retry.mjs";

          const baseUrl = String(process.env.SITE_HEALTH_URL || "").replace(/\/+$/, "");
          const url = `${baseUrl}/healthz.json?health_run=${encodeURIComponent(process.env.HEALTH_CACHE_BUSTER || Date.now())}`;
          const response = await fetchWithTransientRetry(
            url,
            { cache: "no-store", headers: { accept: "application/json" } },
            { attempts: 3, requestTimeoutMs: 15_000, retryDelayMs: 1_000 }
          );
          if (!response.ok) throw new Error(`${url} returned HTTP ${response.status}`);
          const health = await response.json();
          const deploymentId = String(health?.deploymentId || "");
          if (!/^\d+$/.test(deploymentId)) throw new Error("Live health payload has no numeric deploymentId");
          await appendFile(process.env.GITHUB_ENV, `EXPECTED_DEPLOYMENT_ID=${deploymentId}\n`);
          console.log(`Live deployment ID: ${deploymentId}`);
          NODE

      - name: Verify the current deployment payload
        env:
          PAGES_VERIFY_URL: ${{ env.SITE_HEALTH_URL }}
        run: node scripts/verify-pages-deployment.mjs

      - name: Verify public data freshness
        env:
          SITE_EXPECT_INDEXABLE: ${{ vars.PRODUCTION_READY == 'true' }}
        run: node scripts/verify-public-site-freshness.mjs

      - name: Audit parser quality from the public data
        env:
          SEOUL_CINEMA_AUDIT_SCHEDULE_URL: https://seoulcinemaschedule.com/data/schedule.json?health_run=${{ github.run_id }}
          SEOUL_CINEMA_AUDIT_SOURCE_HEALTH_URL: https://seoulcinemaschedule.com/data/source-health.json?health_run=${{ github.run_id }}
          SEOUL_CINEMA_HEALTH_REQUEST_TIMEOUT_MS: "15000"
        run: node scripts/audit-parser-quality.mjs
