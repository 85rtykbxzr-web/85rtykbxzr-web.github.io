name: Check public site health
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - name: Probe official API ports and timetable transports
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import dns from 'node:dns/promises';
          import { execFile } from 'node:child_process';
          import { promisify } from 'node:util';
          const exec=promisify(execFile);
          for(const host of ['api.dtryx.com','www.dtryx.com','www.cinematheque.seoul.kr'])console.log(JSON.stringify({host,ips:await dns.lookup(host,{all:true}).catch(e=>e.code)}));
          const path='/dtryx/cms/thirdparty/movie/third-party-type2-timetable-play-date-list?BrandCd=indieart&CinemaCd=000067&MovieCd=&ChannelCd=homepage&WorkGuID=324A2914-AB19-42A3-BDFE-58A08B2DC35D&EngVerYn=N';
          const sources=[
            ['dtryx-https443','https://api.dtryx.com'+path],
            ['dtryx-https30443','https://api.dtryx.com:30443'+path],
            ['dtryx-public-http','http://www.dtryx.com/cinema/showseq_list.do?BrandCd=indieart&CinemaCd=000067&PlaySDT=2026-09-12'],
            ['sac-https','https://www.cinematheque.seoul.kr/bbs/content.php?co_id=timetable'],
            ['sac-http','http://www.cinematheque.seoul.kr/bbs/content.php?co_id=timetable']
          ];
          await Promise.all(sources.map(async ([source,url])=>{const start=Date.now();try{const r=await fetch(url,{signal:AbortSignal.timeout(20000),headers:{'user-agent':'Mozilla/5.0','accept':'*/*'}});const text=await r.text();let rows;try{rows=JSON.parse(text).Recordset?.length;}catch{}console.log(JSON.stringify({source,status:r.status,url:r.url,ms:Date.now()-start,bytes:text.length,rows,marker:text.includes('timetable')}));}catch(e){console.log(JSON.stringify({source,error:e.message,cause:e.cause?.code,ms:Date.now()-start}));}}));
          for(const [source,url] of sources.filter(([s])=>['dtryx-https443','sac-https'].includes(s))){const r=await exec('curl',['-4','-I','--max-time','20',url]).catch(e=>({stdout:e.stdout,stderr:e.stderr}));console.log(JSON.stringify({curl:source,output:r.stdout,error:r.stderr?.slice(-700)}));}
          JS
