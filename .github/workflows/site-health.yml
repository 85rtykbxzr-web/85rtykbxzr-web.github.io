name: Check public site health
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - name: Probe official API ports and timetable transports
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const production=await fetch('https://seoulcinemaschedule.com/healthz.json?github_probe=1');console.log(JSON.stringify({productionStatus:production.status,body:(await production.text()).slice(0,800)}));
          if(!production.ok)throw new Error('Production domain rejects GitHub health checks');
          import { readCafe24Challenge } from './scripts/cafe24-challenge.mjs';
          const url='https://www.cinematheque.seoul.kr/bbs/content.php?co_id=timetable';
          const first=await fetch(url);const firstText=await first.text();
          const challenge=readCafe24Challenge(firstText,url);
          const response=challenge?await fetch(challenge.url,{headers:{cookie:challenge.cookie}}):first;
          const html=challenge?await response.text():firstText;
          const eventRows=[...html.matchAll(/<tr[^>]+class=["'][^"']*event[^"']*["']/g)].length;
          console.log(JSON.stringify({challengeSolved:Boolean(challenge),status:response.status,bytes:html.length,eventRows}));
          if(!response.ok||eventRows<5)throw new Error('Official timetable remains unavailable');
          JS
